<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="login.pageTitle">Portainer Manager — Connexion</title>
  <link rel="stylesheet" href="style.css" />
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
</head>
<body class="login-body">
  <div class="prefs-corner">
    <button type="button" class="icon-btn theme-btn" id="themeToggle">
      <svg class="theme-icon theme-icon-dark" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="theme-icon theme-icon-light" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      <svg class="theme-icon theme-icon-system" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    </button>
    <button type="button" class="icon-btn lang-btn" id="langToggle" data-i18n-title="lang.switchTo" data-i18n-aria-label="lang.switchTo"><span data-i18n="lang.switchCode">EN</span></button>
  </div>

  <div class="login-card">
    <div class="login-logo">
      <svg width="38" height="38" viewBox="0 0 32 32" fill="none">
        <rect width="32" height="32" rx="8" fill="#13BEF9"/>
        <path d="M8 10h16M8 16h10M8 22h13" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="login-title">Portainer Manager</div>
        <div class="login-subtitle" data-i18n="login.subtitle">Accès sécurisé au dashboard</div>
      </div>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="password" data-i18n="login.password">Mot de passe</label>
        <div class="input-with-toggle">
          <input type="password" id="password" placeholder="••••••••" required autofocus autocomplete="current-password" />
          <button type="button" class="toggle-visibility" id="pwToggle" data-i18n-aria-label="login.showPassword">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="form-error" id="loginError" role="alert"></div>
      <button type="submit" class="btn btn-primary login-submit" id="loginBtn" data-i18n="login.submit">Se connecter</button>
    </form>

    <div class="login-divider" id="ssoDivider" style="display:none"><span data-i18n="login.or">ou</span></div>
    <button type="button" class="btn btn-ghost login-submit" id="ssoBtn" style="display:none"></button>
  </div>

  <script src="login.js"></script>
</body>
</html>
