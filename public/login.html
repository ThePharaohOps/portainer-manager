<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portainer Manager — Connexion</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">
      <svg width="38" height="38" viewBox="0 0 32 32" fill="none">
        <rect width="32" height="32" rx="8" fill="#13BEF9"/>
        <path d="M8 10h16M8 16h10M8 22h13" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="login-title">Portainer Manager</div>
        <div class="login-subtitle">Accès sécurisé au dashboard</div>
      </div>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <div class="input-with-toggle">
          <input type="password" id="password" placeholder="••••••••" required autofocus autocomplete="current-password" />
          <button type="button" class="toggle-visibility" id="pwToggle" aria-label="Afficher le mot de passe">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="form-error" id="loginError"></div>
      <button type="submit" class="btn btn-primary login-submit" id="loginBtn">
        Se connecter
      </button>
    </form>

    <div class="login-divider" id="ssoDivider" style="display:none"><span>ou</span></div>
    <button type="button" class="btn btn-ghost login-submit" id="ssoBtn" style="display:none"></button>
  </div>

  <script>
    document.getElementById('pwToggle').addEventListener('click', () => {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    (async () => {
      if (new URLSearchParams(window.location.search).get('error') === 'oidc') {
        document.getElementById('loginError').textContent = 'Échec de la connexion SSO. Réessayez ou utilisez le mot de passe.';
      }
      try {
        const res = await fetch('/api/auth/methods');
        const methods = await res.json();
        if (methods.oidc) {
          const btn = document.getElementById('ssoBtn');
          btn.textContent = `Se connecter avec ${methods.oidcLabel}`;
          btn.style.display = '';
          document.getElementById('ssoDivider').style.display = '';
          btn.addEventListener('click', () => { window.location.href = '/auth/oidc/login'; });
        }
      } catch {}
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      btn.disabled = true;
      btn.textContent = 'Connexion…';
      err.textContent = '';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value }),
        });
        if (res.ok) {
          window.location.href = '/';
        } else {
          const data = await res.json().catch(() => ({}));
          err.textContent = data.error || 'Erreur de connexion';
          btn.disabled = false;
          btn.textContent = 'Se connecter';
        }
      } catch {
        err.textContent = 'Erreur réseau';
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    });
  </script>
</body>
</html>
