services:
  portainer-manager:
    build: .
    container_name: portainer-manager
    restart: unless-stopped
    ports:
      - "${HOST_IP:-0.0.0.0}:3001:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST_IP=${HOST_IP:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - SESSION_SECRET=${SESSION_SECRET:-}
